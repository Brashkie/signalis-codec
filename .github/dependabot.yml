version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ['@biomejs/*', 'typescript', 'tsup', 'vitest', '@vitest/*', '@types/*', '@napi-rs/*']

  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    labels: [dependencies, rust]
    commit-message:
      prefix: 'chore(cargo)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: [dependencies, ci]
