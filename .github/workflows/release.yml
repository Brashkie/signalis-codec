name: Release

# Builds native binaries for each platform and publishes to npm when a v* tag
# is pushed.
#
# Setup required once, in Settings → Secrets → Actions:
#   NPM_TOKEN — an npm automation token with publish rights on @brashkie

env:
  APP_NAME: signalis-codec
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Guard: tag must match package.json version ──────────────────────────
  version-check:
    name: Tag ↔ package.json match
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against package.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "Tag: $TAG  |  package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG"
            exit 1
          fi

  # ─── Build native binaries per platform ─────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    needs: [version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build native for target
        run: npx napi build --platform --release --target ${{ matrix.target }} --cargo-cwd crates/codec-node --js index.js --dts index.d.ts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  # ─── Publish to npm with all platform binaries ──────────────────────────
  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Build TypeScript
        run: npm run build:ts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move binaries into place
        shell: bash
        run: |
          find artifacts -name '*.node' -exec cp {} . \;
          ls -la *.node
      - name: Prepare npm platform packages
        run: npx napi prepublish -t npm --skip-gh-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Release ─────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## @brashkie/signalis-codec ${{ github.ref_name }}

            ```bash
            npm install @brashkie/signalis-codec@${{ github.ref_name }}
            ```

            A safe, Rust-powered protobuf wire codec. See [CHANGELOG.md](https://github.com/Brashkie/signalis-codec/blob/main/CHANGELOG.md).
